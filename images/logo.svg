<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="tdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect width="100" height="100" rx="24" fill="#0E1017" stroke="#1F2430" stroke-width="2" />
  <!-- Monogram T & D with geometric precision -->
  <path d="M 24 30 L 76 30 M 50 30 L 50 72" stroke="url(#tdGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 46 44 L 62 44 C 74 44 76 56 76 60 C 76 66 72 72 60 72 L 46 72" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <circle cx="76" cy="30" r="4.5" fill="#10B981" filter="url(#glow)" />
</svg>
